name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  package-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(toJson(github.event.pull_request.labels), 'preview-binaries')
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos
            arch: universal
            artifact_name: preview-macos-universal
            artifact_suffix: macos-universal
            app_path: dist/mac-universal/Hush.app
          - runner: windows-latest
            platform: windows
            arch: x64
            artifact_name: preview-windows-x64
            artifact_suffix: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve preview metadata
        shell: bash
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo "PREVIEW_ID=pr${{ github.event.pull_request.number }}-${head_sha::7}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Validate preview macOS signing secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || { echo "::error::Missing MAC_CSC_LINK secret"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "::error::Missing MAC_CSC_KEY_PASSWORD secret"; exit 1; }
          test -n "$APPLE_ID" || { echo "::error::Missing APPLE_ID secret"; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "::error::Missing APPLE_APP_SPECIFIC_PASSWORD secret"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "::error::Missing APPLE_TEAM_ID secret"; exit 1; }

      - name: Package preview app (macOS)
        if: matrix.platform == 'macos'
        timeout-minutes: 45
        env:
          DEBUG: electron-builder,electron-osx-sign*,electron-notarize*
          CSC_FOR_PULL_REQUEST: true
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Package preview app (Windows)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      - name: Verify native module (macOS)
        if: matrix.platform == 'macos'
        run: node scripts/verify-native-module.mjs darwin ${{ matrix.arch }} ${{ matrix.app_path }}

      - name: Verify macOS signing
        if: matrix.platform == 'macos'
        run: npm run verify:macos-signing -- --require-developer-id ${{ matrix.app_path }}

      - name: Verify macOS notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          xcrun stapler validate ${{ matrix.app_path }}
          spctl --assess --type execute --verbose=4 ${{ matrix.app_path }}

      - name: Verify native module (Windows)
        if: matrix.platform == 'windows'
        run: node scripts/verify-native-module.mjs win32 ${{ matrix.arch }}

      - name: Prepare preview artifact names
        shell: bash
        run: |
          mkdir -p preview-dist
          cp -R dist/* preview-dist/ || true

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: preview-dist/*
          if-no-files-found: error

  weekly-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
